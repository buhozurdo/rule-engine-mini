[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rule-engine-mini"
version = "0.5.0"
description = "Deterministic AST business rules evaluator in pure Python — Zero eval(), sub-microsecond latency, safe JSON logic."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Búho Zurdo", email = "dev@buhozurdo.com" },
    { name = "Juan Rael Corrales Arellano", email = "rael@buhozurdo.com" }
]
keywords = ["rule-engine", "json-logic", "ast", "zero-eval", "deterministic", "fintech", "healthtech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Typing :: Typed"
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://buhozurdo.com/blog/rule-engine-mini-json-logic/"
Repository = "https://github.com/buhozurdo/rule-engine-mini"

[tool.hatch.build.targets.wheel]
packages = ["src/rule_engine_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

